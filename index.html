rue});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;R.outputColorSpace=T.SRGBColorSpace;R.toneMapping=T.ACESFilmicToneMapping;R.toneMappingExposure=1.05;document.body.prepend(R.domElement);const M=(c,r=.8,m=0)=>new T.MeshStandardMaterial({color:c,roughness:r,metalness:m,side:T.DoubleSide});function box(n,x,y,z,w,l,h,c=0xe7e0d4,r=.82,m=0){let q=new T.Mesh(new T.BoxGeometry(w,l,h),M(c,r,m));q.name=n;q.position.set(x,y,z);q.castShadow=true;q.receiveShadow=true;S.add(q);return q}function cyl(n,x,y,z,rad,h,c){let q=new T.Mesh(new T.CylinderGeometry(rad,rad,h,20),M(c));q.name=n;q.position.set(x,y,z);q.castShadow=true;S.add(q);return q}const W=4.4,L=9.6,H=2.55;S.add(new T.HemisphereLight(0xf5f0e6,0x4c443c,2.15));let sun=new T.DirectionalLight(0xfff3d9,2.8);sun.position.set(2,-4,6);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);S.add(sun);box('vloer',W/2,L/2,-.035,W,L,.07,0x9b7659,.9);box('linkerwand',-.05,L/2,H/2,.1,L,H,0xe7e0d4);box('achterwand',W/2,L+.05,H/2,W,.1,H,0xd8d0c3);box('voorwandL',.42,-.05,H/2,.84,.1,H);box('voorwandR',W-.42,-.05,H/2,.84,.1,H);box('bovendorpel',W/2,-.05,2.37,W-1.68,.1,.36);box('rechterwand1',W+.05,.28,H/2,.1,.56,H);box('rechterwand2',W+.05,3.15,H/2,.1,1.05,H);box('rechterwand3',W+.05,5.2,H/2,.1,2.8,H);box('rechterwand4',W+.05,9.15,H/2,.1,.9,H);/* patio glazing */for(let x of[.92,2.2,3.48])box('pui-stijl',x,.015,1.2,.045,.045,2.4,0x252728,.35,.45);box('pui-rail',2.2,.015,.07,2.65,.05,.06,0x252728,.35,.45);let glass=new T.Mesh(new T.PlaneGeometry(2.55,2.25),new T.MeshPhysicalMaterial({color:0xaec6c7,transparent:true,opacity:.19,roughness:.12,metalness:0,side:T.DoubleSide}));glass.rotation.x=Math.PI/2;glass.position.set(2.2,.025,1.2);S.add(glass);/* garden cue */box('terras',2.2,-1.2,-.03,4.2,2.3,.06,0x7e766b);for(let x of[.35,4.05])box('pergola',x,-1.3,1.25,.12,.12,2.5,0x5b4937);for(let y of[-.45,-1.35,-2.2])box('pergolabalk',2.2,y,2.48,4.1,.1,.1,0x5b4937);/* yellow partition from photos */box('okerwand',3.12,3.72,1.13,2.5,.12,2.26,0xb38b38);box('achterpartition',3.28,6.23,1.14,2.22,.11,2.28,0xc7b7a1);/* structural ceiling */for(let i=0;i<7;i++)box('betonrib',.28+i*(W-.56)/6,L/2,H-.085,.15,L,.17,0xb8b1a7,.95);for(let y of[3.55,6.14])box('staal',W/2,y,H-.15,W,.19,.25,0x292a2a,.35,.7);/* wavy plaster infill strips */for(let k=0;k<6;k++){let x0=.38+k*(W-.76)/6,x1=.38+(k+1)*(W-.76)/6,vs=[],ix=[],nx=12,ny=70;for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){let x=x0+i*(x1-x0)/(nx-1),y=.08+j*(L-.16)/(ny-1),u=(x-x0)/(x1-x0);vs.push(x,y,H-.205+.038*Math.cos((u-.5)*Math.PI*2))}for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){let q=j*nx+i;ix.push(q,q+nx,q+1,q+1,q+nx,q+nx+1)}let g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(vs,3));g.setIndex(ix);g.computeVertexNormals();let q=new T.Mesh(g,M(0xf1eadf,.92));q.receiveShadow=true;S.add(q)}/* living zone */box('bankzitting',.63,1.48,.36,1.12,2.15,.32,0x353331,.95);box('bankrug',.16,1.48,.69,.2,2.15,.68,0x353331,.95);box('bankarm',.62,.43,.56,1.12,.16,.56,0x353331,.95);box('bankarm',.62,2.53,.56,1.12,.16,.56,0x353331,.95);box('salontafel',2.03,1.58,.25,.95,.66,.08,0x6f4d34,.7);for(let x of[1.66,2.4])for(let y of[1.35,1.81])cyl('tafelpoot',x,y,.12,.025,.24,0x2b2926);/* rug */box('kleed',1.75,1.58,.015,2.35,2.45,.018,0x8d6b4d,.98);/* art */for(let [y,z,w,h,c] of[[.8,1.45,.7,.75,0x75503d],[1.72,1.5,.62,.92,0x253a42],[2.55,1.45,.7,.7,0x9a7344]])box('kunst',.012,y,z,.025,w,h,c,.65);/* lamps */for(let y of[1.2,4.75,7.8]){box('lichtrail',2.2,y,2.29,2.25,.035,.035,0x252525,.4,.7);for(let x of[1.25,2.2,3.15]){let l=new T.PointLight(0xffdfb2,.65,3.1,2);l.position.set(x,y,2.18);S.add(l)}}/* rear zone furniture */box('bedframe',1.18,8.22,.22,1.52,2.05,.28,0x65503f);box('matras',1.18,8.22,.42,1.48,2.0,.22,0xd7d0c5,.98);box('kussen',1.18,8.88,.58,1.12,.45,.18,0xe8e2d8,.98);box('bureau',3.36,8.08,.72,1.3,.62,.07,0x74563d);for(let x of[2.83,3.89])for(let y of[7.85,8.31])cyl('bureaupoot',x,y,.35,.025,.7,0x343331);box('monitor',3.36,8.1,1.23,.65,.07,.42,0x222526,.35);/* rear window */box('raamkozijn',2.15,9.985,1.58,1.7,.05,1.02,0x2e302f,.4,.5);let rw=new T.Mesh(new T.PlaneGeometry(1.55,.87),new T.MeshPhysicalMaterial({color:0x9bb9bc,transparent:true,opacity:.35,roughness:.15,side:T.DoubleSide}));rw.rotation.x=Math.PI/2;rw.position.set(2.15,9.955,1.58);S.add(rw);/* plants */for(let [x,y] of[[3.75,.55],[.42,3.15]]){cyl('pot',x,y,.2,.18,.4,0x8d5940);for(let a=0;a<6;a++){let leaf=new T.Mesh(new T.SphereGeometry(.1,10,8),M(0x536c46,.9));leaf.scale.set(.55,.55,2.6);leaf.position.set(x+Math.sin(a)*.15,y+Math.cos(a)*.15,.55+Math.random()*.25);leaf.rotation.x=Math.sin(a)*.5;S.add(leaf)}}const ctl=new PointerLockControls(C,R.domElement),start=document.querySelector('#start');start.onclick=()=>{start.style.display='none';document.querySelector('#help').style.opacity=.72;if(matchMedia('(pointer:fine)').matches)ctl.lock()};R.domElement.onclick=()=>{if(matchMedia('(pointer:fine)').matches&&start.style.display==='none')ctl.lock()};let keys={},mx=0,my=0,lx=0,ly=0;onkeydown=e=>keys[e.code]=1;onkeyup=e=>keys[e.code]=0;function joy(el,cb){let id,cx,cy;el.onpointerdown=e=>{id=e.pointerId;el.setPointerCapture(id);let r=el.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2};el.onpointermove=e=>{if(e.pointerId===id)cb(Math.max(-1,Math.min(1,(e.clientX-cx)/48)),Math.max(-1,Math.min(1,(e.clientY-cy)/48)))};el.onpointerup=el.onpointercancel=e=>{if(e.pointerId===id){id=null;cb(0,0)}}}joy(document.querySelector('#move'),(x,y)=>{mx=x;my=y});joy(document.querySelector('#look'),(x,y)=>{lx=x;ly=y});let clock=new T.Clock();function loop(){requestAnimationFrame(loop);let d=Math.min(clock.getDelta(),.05),s=1.45;if(keys.KeyW)ctl.moveForward(s*d);if(keys.KeyS)ctl.moveForward(-s*d);if(keys.KeyA)ctl.moveRight(-s*d);if(keys.KeyD)ctl.moveRight(s*d);ctl.moveForward(-my*s*d);ctl.moveRight(mx*s*d);C.rotation.y-=lx*1.8*d;C.rotation.x=Math.max(-1.25,Math.min(1.25,C.rotation.x-ly*1.35*d));C.position.x=Math.max(.15,Math.min(W-.15,C.position.x));C.position.y=Math.max(.15,Math.min(L-.15,C.position.y));C.position.z=1.65;R.render(S,C)}loop();onresize=()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)};</script></body></html>
