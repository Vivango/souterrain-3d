<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Souterrain 3D</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d6d1c9;font-family:system-ui,-apple-system,sans-serif}canvas{display:block}#ui{position:fixed;inset:0;pointer-events:none;color:white}#badge{position:absolute;top:14px;left:14px;background:#000a;padding:10px 13px;border-radius:12px;font-size:13px}#start{pointer-events:auto;position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);border:0;border-radius:14px;padding:16px 22px;font-size:18px;font-weight:700}#help{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#000a;padding:8px 11px;border-radius:11px;font-size:12px;text-align:center}.pad{pointer-events:auto;position:absolute;bottom:58px;width:124px;height:124px;border-radius:50%;background:#ffffff24;border:1px solid #ffffff55;touch-action:none}#move{left:18px}#look{right:18px}@media(pointer:fine){.pad{display:none}}</style></head><body><div id="ui"><div id="badge">Souterrain 3D · concept 4,4 × 9,6 × 2,55 m</div><button id="start">Binnenlopen</button><div id="help">iPhone: links lopen · rechts kijken<br>Computer: WASD + muis</div><div class="pad" id="move"></div><div class="pad" id="look"></div></div><script type="module">import * as T from'https://cdn.jsdelivr.net/npm/three@0.167.1/build/three.module.js';import{PointerLockControls}from'https://cdn.jsdelivr.net/npm/three@0.167.1/examples/jsm/controls/PointerLockControls.js';const S=new T.Scene();S.background=new T.Color(0xd6d1c9);const C=new T.PerspectiveCamera(72,innerWidth/innerHeight,.03,100);C.position.set(2.2,.45,1.65);C.rotation.order='YXZ';const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.setSize(innerWidth,innerHeight);document.body.prepend(R.domElement);S.add(new T.HemisphereLight(0xffffff,0x67584a,2.5));let sun=new T.DirectionalLight(0xffffff,2.2);sun.position.set(2,-3,6);S.add(sun);const M=c=>new T.MeshStandardMaterial({color:c,roughness:.85,side:T.DoubleSide});function box(x,y,z,w,l,h,c=0xe6e0d5){let m=new T.Mesh(new T.BoxGeometry(w,l,h),M(c));m.position.set(x,y,z);S.add(m)}const W=4.4,L=9.6,H=2.55;box(W/2,L/2,-.04,W,L,.08,0xb99b78);box(-.05,L/2,H/2,.1,L,H);box(W/2,L+.05,H/2,W,.1,H);box(.45,-.05,H/2,.9,.1,H);box(W-.45,-.05,H/2,.9,.1,H);box(W/2,-.05,2.38,W-1.8,.1,.34);box(W+.05,.2,H/2,.1,.4,H);box(W+.05,3.25,H/2,.1,1.1,H);box(W+.05,5.25,H/2,.1,2.9,H);box(W+.05,9.05,H/2,.1,1.1,H);box(3.1,3.75,1.18,2.6,.11,2.36,0xb78532);box(3.25,6.25,1.18,2.3,.11,2.36,0xc9b99d);for(let i=0;i<7;i++)box(.28+i*(W-.56)/6,L/2,H-.09,.14,L,.18,0xbbb5aa);for(let y of[3.55,6.15])box(W/2,y,H-.13,W,.18,.24,0x333333);box(.65,1.55,.36,1.22,2.25,.62,0x383532);box(2.15,1.75,.26,.95,.72,.52,0x79583e);box(1.25,8.15,.3,1.55,2,.42,0xd4c9ba);box(3.35,8.05,.38,1.25,.62,.76,0x72573f);let vs=[],ix=[],nx=60,ny=100;for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){let x=.08+i*(W-.16)/(nx-1),y=.08+j*(L-.16)/(ny-1);vs.push(x,y,H-.31+.055*Math.cos(2*Math.PI*x/.62))}for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){let q=j*nx+i;ix.push(q,q+nx,q+1,q+1,q+nx,q+nx+1)}let g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(vs,3));g.setIndex(ix);g.computeVertexNormals();S.add(new T.Mesh(g,M(0xf5f2e9)));const ctl=new PointerLockControls(C,R.domElement),start=document.querySelector('#start');start.onclick=()=>{start.style.display='none';if(matchMedia('(pointer:fine)').matches)ctl.lock()};let keys={},mx=0,my=0,lx=0,ly=0;onkeydown=e=>keys[e.code]=1;onkeyup=e=>keys[e.code]=0;function joy(el,cb){let id,cx,cy;el.onpointerdown=e=>{id=e.pointerId;el.setPointerCapture(id);let r=el.getBoundingClientRect();cx=r.left+r.width/2;cy=r.top+r.height/2};el.onpointermove=e=>{if(e.pointerId==id)cb(Math.max(-1,Math.min(1,(e.clientX-cx)/48)),Math.max(-1,Math.min(1,(e.clientY-cy)/48)))};el.onpointerup=el.onpointercancel=e=>{if(e.pointerId==id){id=null;cb(0,0)}}}joy(document.querySelector('#move'),(x,y)=>{mx=x;my=y});joy(document.querySelector('#look'),(x,y)=>{lx=x;ly=y});let clock=new T.Clock();function loop(){requestAnimationFrame(loop);let d=Math.min(clock.getDelta(),.05),s=1.55;if(keys.KeyW)ctl.moveForward(s*d);if(keys.KeyS)ctl.moveForward(-s*d);if(keys.KeyA)ctl.moveRight(-s*d);if(keys.KeyD)ctl.moveRight(s*d);ctl.moveForward(-my*s*d);ctl.moveRight(mx*s*d);C.rotation.y-=lx*1.8*d;C.rotation.x=Math.max(-1.3,Math.min(1.3,C.rotation.x-ly*1.4*d));C.position.x=Math.max(.15,Math.min(W-.15,C.position.x));C.position.y=Math.max(.15,Math.min(L-.15,C.position.y));C.position.z=1.65;R.render(S,C)}loop();onresize=()=>{C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix();R.setSize(innerWidth,innerHeight)};</script></body></html>
